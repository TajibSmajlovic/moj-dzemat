# Fly.io configuration for moj-dzemat.
#
# Single-Machine deployment in Frankfurt (geographically close to the
# Bosnian audience and EU-hosted for data residency). Auto-stop keeps
# the instance warm during the day and idles at night; LiteFS is a
# static-lease single writer so we never run more than one instance.
#
# Secrets (set once per env, out of band):
#   fly secrets set SESSION_SECRET=... PASSWORD_RESET_SECRET=... \
#                   HONEYPOT_SECRET=... RESEND_API_KEY=... \
#                   EMAIL_FROM=... APP_URL=...
#
# Rotate by prepending a new comma-separated value to the relevant
# secret (see env.server.ts docstring).

app = "moj-dzemat"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[experimental]
  auto_rollback = true

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TZ = "Europe/Sarajevo"
  DATABASE_URL = "file:/litefs/data.db"
  PRIMARY_REGION = "fra"

[mounts]
  source = "litefs"
  destination = "/var/lib/litefs"
  initial_size = "3gb"

[[services]]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 120

  [[services.http_checks]]
    interval = "15s"
    grace_period = "30s"
    method = "get"
    path = "/resources/healthcheck"
    protocol = "http"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
