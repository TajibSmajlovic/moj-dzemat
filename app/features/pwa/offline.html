<!doctype html>
<html lang="bs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="__MOJ_DZEMAT_PWA_THEME_COLOR__" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; media-src 'none'; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Bez interneta · Moj džemat</title>
    <script>
      try {
        var storedTheme = globalThis.localStorage.getItem("moj-dzemat-theme");
        var cookieTheme = document.cookie.match(/(?:^|;\s*)mdz_theme=([^;]+)/)?.[1];
        var preferredTheme = storedTheme || (cookieTheme ? decodeURIComponent(cookieTheme) : null);
        document.documentElement.classList.toggle("dark", preferredTheme === "dark");
      } catch {}
    </script>
    <style>
      @font-face {
        font-family: "Lora Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 400 700;
        src: url("data:font/woff2;base64,__MOJ_DZEMAT_LORA_LATIN_EXT_FONT__")
          format("woff2-variations");
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }

      @font-face {
        font-family: "Lora Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 400 700;
        src: url("data:font/woff2;base64,__MOJ_DZEMAT_LORA_LATIN_FONT__") format("woff2-variations");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        color-scheme: light;
        --background: __MOJ_DZEMAT_PWA_BACKGROUND_COLOR__;
        --foreground: hsl(160 30% 12%);
        --card: hsl(40 30% 99%);
        --card-foreground: hsl(160 30% 12%);
        --primary: __MOJ_DZEMAT_PWA_THEME_COLOR__;
        --primary-hover: hsl(162 63% 23%);
        --primary-foreground: hsl(40 33% 97%);
        --secondary: hsl(38 60% 55%);
        --secondary-foreground: hsl(40 33% 97%);
        --muted: hsl(40 20% 92%);
        --muted-foreground: hsl(160 12% 38%);
        --accent: hsl(162 40% 90%);
        --accent-foreground: hsl(162 63% 22%);
        --border: hsl(40 20% 88%);
        --ring: hsl(162 63% 28%);
        --destructive: hsl(0 72% 44%);
        --destructive-soft: hsl(0 72% 96%);
        --warning: hsl(38 60% 55%);
        --warning-soft: hsl(38 78% 94%);
        --shadow-sm: 0 1px 2px hsl(0 0% 0% / 0.06);
        --shadow-md: 0 8px 24px hsl(0 0% 0% / 0.07);
        --font-display:
          "Lora Variable", "Lora", ui-serif, Georgia, Cambria, "Times New Roman", serif;
        --font-sans:
          "Inter Variable", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-family: var(--font-sans);
      }

      html.dark {
        color-scheme: dark;
        --background: hsl(164 42% 7%);
        --foreground: hsl(42 36% 92%);
        --card: hsl(164 34% 10%);
        --card-foreground: hsl(42 36% 92%);
        --primary: hsl(160 56% 44%);
        --primary-hover: hsl(160 56% 50%);
        --primary-foreground: hsl(165 45% 7%);
        --secondary: hsl(38 67% 61%);
        --secondary-foreground: hsl(165 45% 8%);
        --muted: hsl(164 24% 15%);
        --muted-foreground: hsl(154 13% 70%);
        --accent: hsl(160 34% 18%);
        --accent-foreground: hsl(42 34% 90%);
        --border: hsl(160 18% 24%);
        --ring: hsl(160 56% 48%);
        --destructive: hsl(2 70% 68%);
        --destructive-soft: hsl(2 45% 15%);
        --warning: hsl(38 67% 61%);
        --warning-soft: hsl(38 42% 14%);
        --shadow-sm: 0 1px 2px hsl(165 70% 3% / 0.32);
        --shadow-md: 0 10px 28px hsl(165 75% 3% / 0.4);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        overflow-x: clip;
        background: var(--background);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-wrap: anywhere;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        line-height: 1.6;
        text-rendering: geometricprecision;
      }

      html.dark body {
        background: linear-gradient(180deg, var(--background), hsl(164 45% 6%));
      }

      a {
        color: inherit;
      }

      button,
      a {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      button {
        font-family: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }

      .offline-header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
        background: color-mix(in srgb, var(--background) 86%, transparent);
        backdrop-filter: blur(14px);
      }

      .offline-header-inner,
      .offline-main {
        width: min(100% - 2rem, 64rem);
        margin-inline: auto;
      }

      .offline-header-inner {
        display: flex;
        min-height: 4.5rem;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding-block: 0.75rem;
      }

      .offline-brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 0.75rem;
        border-radius: 0.375rem;
        text-decoration: none;
      }

      .offline-brand-logo {
        display: block;
        width: 2.25rem;
        height: 2.25rem;
        flex: none;
      }

      .offline-brand-logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .offline-brand-copy {
        display: flex;
        min-width: 0;
        flex-direction: column;
        line-height: 1;
      }

      .offline-brand-name {
        font-family: var(--font-display);
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.25;
      }

      .offline-brand-context {
        margin-top: 0.2rem;
        color: var(--muted-foreground);
        font-size: 0.75rem;
        line-height: 1.2;
      }

      .offline-status-badge {
        display: inline-flex;
        min-height: 2.25rem;
        flex: none;
        align-items: center;
        gap: 0.45rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.35rem 0.7rem;
        background: color-mix(in srgb, var(--card) 76%, transparent);
        color: var(--muted-foreground);
        font-size: 0.75rem;
        font-weight: 650;
        white-space: nowrap;
        box-shadow: var(--shadow-sm);
      }

      .offline-status-badge::before {
        width: 0.5rem;
        height: 0.5rem;
        flex: none;
        border-radius: 999px;
        background: var(--warning);
        content: "";
      }

      .offline-main {
        padding-block: 1.5rem 3rem;
      }

      .offline-stack {
        display: grid;
        gap: 1.5rem;
      }

      .offline-connection {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border: 1px solid var(--border);
        border-left: 4px solid var(--warning);
        border-radius: 0.75rem;
        padding: 0.9rem 1rem;
        background: var(--card);
        box-shadow: var(--shadow-sm);
      }

      .offline-connection-copy {
        min-width: 0;
      }

      .offline-connection-title {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 700;
      }

      .offline-connection-description {
        margin: 0.1rem 0 0;
        color: var(--muted-foreground);
        font-size: 0.875rem;
        line-height: 1.5;
      }

      .offline-page-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
      }

      .offline-title,
      .offline-section-title,
      .offline-post-title,
      .offline-prose h2,
      .offline-prose h3 {
        font-family: var(--font-display);
        text-rendering: optimizelegibility;
      }

      .offline-title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.2;
        text-wrap: balance;
      }

      .offline-heading-description,
      .offline-empty {
        margin: 0.35rem 0 0;
        color: var(--muted-foreground);
        font-size: 0.875rem;
      }

      .offline-button {
        display: inline-flex;
        min-height: 2.75rem;
        flex: none;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        border: 1px solid transparent;
        border-radius: 999px;
        padding: 0.6rem 1rem;
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        text-decoration: none;
      }

      .offline-button:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      .offline-button-primary {
        background: var(--primary);
        color: var(--primary-foreground);
        box-shadow: var(--shadow-sm);
      }

      .offline-button-primary:hover {
        background: var(--primary-hover);
      }

      .offline-button-outline {
        border-color: var(--border);
        background: var(--background);
        color: var(--foreground);
      }

      .offline-button-outline:hover {
        background: var(--accent);
        color: var(--accent-foreground);
      }

      .offline-button-danger {
        background: var(--destructive);
        color: white;
      }

      .offline-button-ghost-danger {
        min-height: 2.5rem;
        padding-inline: 0.5rem;
        background: transparent;
        color: var(--destructive);
      }

      .offline-route-notice {
        margin: 0;
        border: 1px solid color-mix(in srgb, var(--warning) 50%, var(--border));
        border-radius: 0.75rem;
        padding: 0.75rem 1rem;
        background: var(--warning-soft);
        color: var(--foreground);
        font-size: 0.875rem;
      }

      .offline-saved-section {
        min-width: 0;
      }

      .offline-section-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .offline-section-title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.25;
      }

      .offline-section-count {
        margin: 0;
        color: var(--muted-foreground);
        font-size: 0.8rem;
      }

      .offline-post-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.875rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .offline-post-item {
        min-width: 0;
      }

      .offline-post-link {
        display: flex;
        min-height: 9rem;
        height: 100%;
        min-width: 0;
        flex-direction: column;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1rem;
        background: var(--card);
        color: var(--card-foreground);
        text-decoration: none;
        box-shadow: var(--shadow-sm);
      }

      .offline-post-link:hover {
        border-color: color-mix(in srgb, var(--primary) 55%, var(--border));
        box-shadow: var(--shadow-md);
      }

      .offline-post-badge,
      .offline-article-badge {
        display: inline-flex;
        width: max-content;
        max-width: 100%;
        align-items: center;
        border-radius: 999px;
        padding: 0.2rem 0.65rem;
        background: color-mix(in srgb, var(--primary) 10%, transparent);
        color: var(--primary);
        font-size: 0.75rem;
        font-weight: 600;
      }

      [data-post-type="hutba"] {
        background: color-mix(in srgb, var(--secondary) 15%, transparent);
        color: color-mix(in srgb, var(--secondary) 76%, var(--foreground));
      }

      [data-post-type="smrtovnica"] {
        background: color-mix(in srgb, var(--foreground) 8%, transparent);
        color: var(--muted-foreground);
      }

      [data-post-type="price"] {
        background: hsl(24 45% 90%);
        color: hsl(24 45% 28%);
      }

      html.dark [data-post-type="price"] {
        background: hsl(24 38% 22%);
        color: hsl(28 65% 78%);
      }

      .offline-post-title {
        margin: 0.65rem 0 0;
        font-size: 1rem;
        font-weight: 600;
        line-height: 1.35;
        text-wrap: balance;
      }

      .offline-post-footer {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 0.75rem;
        margin-top: auto;
        padding-top: 0.85rem;
      }

      .offline-post-meta,
      .offline-action-status {
        color: var(--muted-foreground);
        font-size: 0.75rem;
      }

      .offline-post-cta {
        flex: none;
        color: var(--primary);
        font-size: 0.8rem;
        font-weight: 600;
      }

      .offline-empty-state {
        border: 1px dashed var(--border);
        border-radius: 0.75rem;
        padding: 2rem 1rem;
        background: color-mix(in srgb, var(--muted) 35%, transparent);
        text-align: center;
      }

      .offline-empty-state .offline-empty {
        max-width: 34rem;
        margin-inline: auto;
      }

      .offline-clear-area {
        display: flex;
        min-height: 3rem;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      .offline-clear-confirmation {
        display: flex;
        width: 100%;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
        border-top: 1px solid var(--border);
        padding-top: 0.75rem;
      }

      .offline-clear-prompt {
        margin: 0 auto 0 0;
        color: var(--muted-foreground);
        font-size: 0.875rem;
      }

      .offline-action-status {
        width: 100%;
        min-height: 1.25rem;
        margin: 0;
        text-align: right;
      }

      .offline-article-shell {
        display: grid;
        max-width: 48rem;
        margin-inline: auto;
        gap: 1.25rem;
      }

      .offline-back-link {
        display: inline-flex;
        min-height: 2.75rem;
        width: max-content;
        max-width: 100%;
        align-items: center;
        gap: 0.5rem;
        margin-left: -0.5rem;
        border-radius: 0.375rem;
        padding: 0.45rem 0.5rem;
        color: var(--muted-foreground);
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }

      .offline-back-link::before {
        content: "←";
        font-size: 1rem;
      }

      .offline-back-link:hover {
        color: var(--foreground);
      }

      .offline-copy-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        border: 1px solid var(--border);
        border-left: 4px solid var(--warning);
        border-radius: 0.75rem;
        padding: 0.75rem 0.9rem;
        background: var(--card);
        box-shadow: var(--shadow-sm);
      }

      .offline-copy-label,
      .offline-copy-date {
        display: block;
      }

      .offline-copy-label {
        font-size: 0.8rem;
        font-weight: 700;
      }

      .offline-copy-date {
        margin-top: 0.1rem;
        color: var(--muted-foreground);
        font-size: 0.75rem;
      }

      .offline-article {
        min-width: 0;
      }

      .offline-article-title {
        margin: 0.75rem 0;
        font-family: var(--font-display);
        font-size: 1.5rem;
        font-weight: 700;
        line-height: 1.16;
        text-wrap: balance;
      }

      .offline-article-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .offline-published-date {
        color: var(--muted-foreground);
        font-size: 0.875rem;
      }

      .offline-media-placeholder {
        border: 1px dashed var(--border);
        border-radius: 0.75rem;
        padding: 1rem;
        background: color-mix(in srgb, var(--muted) 30%, transparent);
      }

      .offline-media-title {
        margin: 0;
        font-size: 0.875rem;
        font-weight: 700;
      }

      .offline-media-description {
        margin: 0.15rem 0 0;
        color: var(--muted-foreground);
        font-size: 0.875rem;
      }

      .offline-prose {
        min-width: 0;
        margin-top: 2rem;
        border-top: 1px solid var(--border);
        padding-top: 2rem;
        color: color-mix(in srgb, var(--foreground) 85%, transparent);
        line-height: 1.75;
      }

      .offline-prose > :first-child {
        margin-top: 0;
      }

      .offline-prose > :last-child {
        margin-bottom: 0;
      }

      .offline-prose h2,
      .offline-prose h3 {
        margin: 1.6em 0 0.55em;
        color: var(--foreground);
        font-weight: 600;
        line-height: 1.25;
      }

      .offline-prose a {
        color: var(--primary);
        font-weight: 600;
        text-underline-offset: 0.2rem;
      }

      .offline-prose blockquote {
        margin-inline: 0;
        border-left: 0.25rem solid color-mix(in srgb, var(--primary) 30%, transparent);
        padding-left: 1rem;
        color: var(--muted-foreground);
      }

      .offline-prose pre {
        max-width: 100%;
        overflow-x: auto;
        border-radius: 0.65rem;
        background: var(--muted);
        padding: 0.9rem;
      }

      @media (min-width: 40rem) {
        .offline-main {
          padding-block: 2rem 4rem;
        }

        .offline-title,
        .offline-section-title {
          font-size: 1.875rem;
        }

        .offline-article-title {
          font-size: 2.25rem;
          line-height: 1.25;
        }
      }

      @media (max-width: 39.999rem) {
        .offline-main {
          padding-top: 1rem;
        }

        .offline-connection,
        .offline-page-heading,
        .offline-copy-status {
          align-items: stretch;
          flex-direction: column;
        }

        .offline-connection .offline-button,
        .offline-copy-status .offline-button {
          width: 100%;
        }

        .offline-post-list {
          grid-template-columns: minmax(0, 1fr);
        }

        .offline-section-heading {
          display: block;
        }

        .offline-section-count {
          margin-top: 0.25rem;
        }
      }

      @media (max-width: 22rem) {
        .offline-header-inner,
        .offline-main {
          width: min(100% - 1.25rem, 64rem);
        }

        .offline-brand-logo {
          width: 2rem;
          height: 2rem;
        }

        .offline-brand-name {
          font-size: 0.9rem;
        }

        .offline-brand-context {
          display: none;
        }

        .offline-status-badge {
          padding-inline: 0.55rem;
          font-size: 0.7rem;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .offline-button,
        .offline-post-link,
        .offline-back-link {
          transition:
            background-color 150ms ease,
            border-color 150ms ease,
            color 150ms ease,
            box-shadow 150ms ease,
            opacity 150ms ease;
        }
      }
    </style>
  </head>
  <body>
    <header class="offline-header">
      <div class="offline-header-inner">
        <a class="offline-brand" href="/" aria-label="Moj džemat">
          <span class="offline-brand-logo" aria-hidden="true">__MOJ_DZEMAT_OFFLINE_LOGO__</span>
          <span class="offline-brand-copy">
            <span class="offline-brand-name">Moj džemat</span>
            <span class="offline-brand-context">Rijaset Islamske zajednice u BiH</span>
          </span>
        </a>
        <span class="offline-status-badge">Bez interneta</span>
      </div>
    </header>

    <main id="offline-app" class="offline-main" aria-live="polite" aria-busy="true">
      <div class="offline-stack">
        <section class="offline-connection" aria-label="Status veze">
          <div class="offline-connection-copy">
            <p class="offline-connection-title">Trenutno niste povezani na internet</p>
            <p class="offline-connection-description">
              Provjerite vezu i pokušajte ponovo učitati sadržaj.
            </p>
          </div>
          <a class="offline-button offline-button-primary" href="">Pokušaj ponovo</a>
        </section>

        <section class="offline-saved-section">
          <div class="offline-section-heading">
            <h1 class="offline-section-title">Sačuvane objave</h1>
          </div>
          <div class="offline-empty-state">
            <p class="offline-empty">
              Sačuvane objave trenutno nije moguće učitati na ovom uređaju.
            </p>
          </div>
        </section>
      </div>
    </main>

    <script>
      __MOJ_DZEMAT_OFFLINE_SHELL_SCRIPT__;
    </script>
  </body>
</html>
