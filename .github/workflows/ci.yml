name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  # Cancel outdated runs on the same branch but always let `master` finish;
  # the deploy job below is gated separately.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    name: Lint · Typecheck · Format · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - run: cp .env.example .env

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run build

  test:
    name: Unit · Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - run: cp .env.example .env

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - run: cp .env.example .env

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report
            test-results
          retention-days: 7

  pwa:
    name: Playwright PWA production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - run: cp .env.example .env

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pwa
        env:
          CI: "true"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-pwa-artifacts
          path: |
            playwright-pwa-report
            test-results/pwa
          retention-days: 7
