name: npm audit fix

on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  # Every run checks master and writes the same automation branch.
  group: npm-audit-fix
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-fix:
    name: Open PR for fixable npm audit issues
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          # Dependency scripts run before the PR step and must not inherit a
          # stored token with repository write access.
          persist-credentials: false

      - run: cp .env.example .env

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@11.18.0
      - run: npm ci

      - name: Check for npm audit issues
        id: audit
        continue-on-error: true
        run: npm audit

      - name: Apply safe npm audit fixes
        if: steps.audit.outcome == 'failure'
        continue-on-error: true
        run: npm audit fix

      - name: Detect dependency changes
        id: changes
        if: steps.audit.outcome == 'failure'
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify audit after fixes
        id: verify
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: npm audit

      - name: Validate dependency changes
        id: validate
        if: steps.verify.outcome == 'success'
        run: |
          npx playwright install --with-deps chromium
          npm run agent:verify

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.validate.outcome == 'failure'
        with:
          name: npm-audit-browser-artifacts
          path: |
            playwright-report
            playwright-pwa-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Create pull request
        if: >
          steps.changes.outputs.changed == 'true' &&
          steps.verify.outcome == 'success' &&
          steps.validate.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/npm-audit-fix
          delete-branch: true
          title: "chore: fix npm audit issues"
          commit-message: "chore: fix npm audit issues"
          body: |
            Automated PR created after `npm audit` found vulnerabilities
            with safe automatic fixes.

            Validation completed:
            - npm audit
            - documentation, architecture, typecheck, lint, and formatting
            - Knip
            - unit and integration tests
            - Playwright end-to-end tests
            - production PWA tests and build
          labels: |
            dependencies
            npm
            security

      - name: Report vulnerabilities requiring manual action
        if: >
          always() &&
          steps.audit.outcome == 'failure' &&
          steps.verify.outcome != 'success'
        run: |
          {
            echo "## Manual dependency update required"
            echo ""
            echo "\`npm audit fix\` could not produce a clean dependency graph."
            echo "Review the audit output and update the affected direct dependency manually."
          } >> "$GITHUB_STEP_SUMMARY"
          npm audit
