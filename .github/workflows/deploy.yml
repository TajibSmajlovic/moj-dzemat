name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    # keep manual trigger available

concurrency:
  # Serialize deploys so two pushes in quick succession never race on
  # the single LiteFS primary.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Fly deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # Manual dispatch can always deploy. Automatic deploys only proceed once
    # CI has completed successfully for the `master` push they were triggered by.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          !contains(github.event.workflow_run.head_commit.message, '[skip deploy]')
        )
      }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Deploy the exact commit that passed CI rather than whatever happens
          # to be at the branch tip when this workflow starts.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
