name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    # keep manual trigger available

concurrency:
  # Serialize deploys so two pushes in quick succession never race on
  # the single LiteFS primary.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Fly deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # Skip the deploy if the head commit opted out via `[skip deploy]` in
    # the commit message. Handy for docs-only pushes.
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
