# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # npm dependencies (root package.json).
  # Review routine updates together; security updates can arrive immediately.
  # Major version updates remain separate for deliberate review.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Sarajevo
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # Keep the Prisma stack on the current major; future major upgrades
      # should remain deliberate migrations.
      - dependency-name: prisma
        update-types:
          - version-update:semver-major
      - dependency-name: "@prisma/*"
        update-types:
          - version-update:semver-major
      # Keep Node runtime types aligned with package.json#engines.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Treat major framework/tooling upgrades as deliberate migrations.
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-major
      - dependency-name: react-router
        update-types:
          - version-update:semver-major
      - dependency-name: "@react-router/*"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/*"
        update-types:
          - version-update:semver-major
      # Keep the lint toolchain on the current ESLint 10-compatible line.
      # Dependabot cannot evaluate cross-package ESLint peer ranges, so
      # major lint-package bumps should be handled as a deliberate migration.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "@typescript-eslint/*"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript-eslint
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-config-*
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-plugin-*
        update-types:
          - version-update:semver-major
      - dependency-name: globals
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions used by workflows under .github/workflows/.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Sarajevo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
