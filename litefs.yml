# LiteFS configuration.
#
# Single-writer setup designed for one Fly Machine. We use a `static` lease
# without a Consul coordinator. Before scaling horizontally, switch to
# coordinated leases and shared rate-limit state.
#
# The FUSE-mounted filesystem lives at `/litefs`; replicated DB files
# are backed by the Fly volume at `/var/lib/litefs`. SQLite talks to
# `/litefs/data.db` (see `DATABASE_URL` in the Dockerfile).

fuse:
  dir: "/litefs"

data:
  dir: "/var/lib/litefs"

# Bind LiteFS's HTTP API to localhost so the health check / import /
# export endpoints are reachable from inside the Machine but never
# exposed publicly.
http:
  addr: ":20202"

# The proxy is configured for write forwarding. With the current single-Machine
# static lease it is effectively a local pass-through.
proxy:
  addr: ":20203"
  target: "localhost:3000"
  db: "data.db"

lease:
  type: "static"
  advertise-url: "http://localhost:20202"
  candidate: true

exec:
  - cmd: "/app/start.sh"
